services:
  mongodb:
    image: mongo:7
    container_name: chat_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: chat_server
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/chat_app
      - JWT_SECRET=chat_app_secret_123
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build: ./client
    container_name: chat_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SERVER_URL=http://localhost:5000

volumes:
  mongo_data:
